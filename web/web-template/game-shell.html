function debriefWithDetails(p){const c=debrief(p),r=p.report||{};if(p.level!=='level2')return c;const main=card('Main four-plate claims','These support flags and reasons come from the completed model record.'),claims=el('ul');claims.append(el('li',{},'Selection claim: '+(r.mainSelectionClaimSupported?'supported':'withheld')+'. '+((r.claimReasons||{})['main-selection']||'')),el('li',{},'Expression claim: '+(r.mainExpressionClaimSupported?'supported':'withheld')+'. '+((r.claimReasons||{})['main-expression']||'')));main.append(claims);const caseReport=r.diagnosticCase;if(caseReport){const dc=card(caseReport.title||'Lab Detective debrief','The fictional cause is disclosed only after the completed case record.');dc.append(el('p',{},caseReport.finalFictionalCause||''),el('p',{},'Selection claim: '+(caseReport.selectionClaimSupported?'supported':'withheld')+'. '+(caseReport.selectionClaimReason||'')),el('p',{},'Expression claim: '+(caseReport.expressionClaimSupported?'supported':'withheld')+'. '+(caseReport.expressionClaimReason||'')));main.append(dc)}const history=el('details');history.append(el('summary',{},'Prediction and correction history'));const list=el('ul');(r.predictions||[]).forEach(x=>list.append(el('li',{},x.plateId+': original growth '+x.originalGrowthPrediction+'; original fluorescence '+x.originalFluorescencePrediction+'; revisions '+((x.revisions||[]).join(', ')||'none'))));['tubeSetupCorrections','plateAssignmentCorrections','prelockPredictionCorrections','evidenceCardsViewed','diagnosticDecisions'].forEach(k=>(r[k]||[]).forEach(x=>list.append(el('li',{},k+': '+x))));history.append(list);main.append(history);main.append(action('Start a linked '+(p.mode==='Assessment'?'assessment':'practice')+' retry',{kind:'linked-retry'},'linked-retry'));c.append(main);return c}
let dbPromise;function db(){if(!dbPromise)dbPromise=new Promise((ok,bad)=>{const r=indexedDB.open('cancer-lab-trainer:web:v1',1);r.onupgradeneeded=()=>['level1','level2'].forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})});r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)});return dbPromise}async function listAttempts(raw){const p=parse(raw);try{const d=await db(),t=d.transaction(p.level),r=t.objectStore(p.level).getAll();r.onsuccess=()=>send({kind:'storage-list',level:p.level,entries:r.result.filter(x=>x.status==='committed')});r.onerror=()=>send({kind:'storage-list',level:p.level,entries:[]})}catch(e){send({kind:'storage-list',level:p.level,entries:[]})}}function download(raw){const p=parse(raw),a=document.createElement('a'),url=URL.createObjectURL(new Blob([p.body],{type:p.type}));a.href=url;a.download=p.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
const storageAdapter=CancerLabStorageAdapter.create({openDatabase:db,completeTransaction:CancerLabStorageAdapter.completeTransaction,notify:send});window.CancerLabWeb={ready(){},render(raw){const p=parse(raw);p.screen==='menu'?renderMenu(p):renderRun(p)},saveAttempt:raw=>storageAdapter.save(parse(raw)).catch(()=>{}),listAttempts,deleteAttempt:raw=>storageAdapter.delete(parse(raw)).catch(()=>{}),download};
engine.startGame({canvasItem:canvas,onProgress:(c,t)=>{document.getElementById('status-progress').value=t?c/t:0}}).then(()=>{document.getElementById('status').remove();keepCanvasOutOfTabOrder();const target=firstTaskControl();if(target)requestAnimationFrame(()=>target.focus())}).catch(e=>{console.error(e);text(document.getElementById('status-notice'),'Unable to start this training station.')});
