<!doctype html><meta charset="utf-8"><title>IndexedDB storage adapter check</title>
<button id="run">Run storage checks</button><pre id="result">Not run.</pre><script src="storage_adapter.js"></script><script>
const result=document.getElementById("result"),dbName="cancer-lab-trainer:web:validation-only";
function open(){return new Promise((ok,bad)=>{const r=indexedDB.open(dbName,1);r.onupgradeneeded=()=>["level1","level2"].forEach(s=>r.result.createObjectStore(s,{keyPath:"id"}));r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)})}
async function read(db,level,id){return new Promise((ok,bad)=>{const r=db.transaction(level).objectStore(level).get(id);r.onsuccess=()=>ok(r.result);r.onerror=()=>bad(r.error)})}
document.getElementById("run").onclick=async()=>{const events=[],complete=CancerLabStorageAdapter.completeTransaction,db=await open(),adapter=CancerLabStorageAdapter.create({openDatabase:async()=>db,completeTransaction:complete,notify:e=>events.push(e)});try{const seed=db.transaction("level1","readwrite");seed.objectStore("level1").put({id:"good",level:"level1",save:"old",status:"committed"});await complete(seed);let abort=true;const abortAdapter=CancerLabStorageAdapter.create({openDatabase:async()=>db,completeTransaction:tx=>{if(abort){abort=false;tx.abort();return complete(tx)}return complete(tx)},notify:e=>events.push(e)});await abortAdapter.save({id:"good",level:"level1",save:"new"}).catch(()=>{});if((await read(db,"level1","good")).save!=="old"||events.at(-1).status!=="failed")throw Error("abort did not preserve old committed record");await Promise.all([adapter.save({id:"latest",level:"level1",save:"one"}),adapter.save({id:"latest",level:"level1",save:"two"})]);if((await read(db,"level1","latest")).save!=="two")throw Error("latest queued save lost");await Promise.all([adapter.save({id:"gone",level:"level1",save:"new"}),adapter.delete({id:"gone",level:"level1"})]);if(await read(db,"level1","gone"))throw Error("delete did not win");await Promise.all([adapter.save({id:"same",level:"level1",save:"one"}),adapter.save({id:"same",level:"level2",save:"two"})]);if((await read(db,"level2","same")).save!=="two")throw Error("cross-level scope lost");result.textContent="PASS: real IndexedDB abort, queue, delete, and level-scope checks."}catch(error){result.textContent="FAIL: "+error.stack}};
</script>
